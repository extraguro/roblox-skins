<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TG Channel Scanner</title>
<style>
:root{--bg:#0f1419;--card:#18202a;--bd:#263241;--tx:#e6edf3;--mut:#8b98a5;--ac:#2aabee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;z-index:5}
.wrap{max-width:1200px;margin:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 10px;font-size:14px}
input[name=word]{width:180px}input[type=number]{width:90px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}
button.sec{background:var(--card);border:1px solid var(--bd);color:var(--tx)}button.stop{background:#e5534b}button:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.fl{border-top:1px solid var(--bd);padding-top:8px;margin-top:4px}
.fl[hidden]{display:none}
#bar{color:var(--mut);font-size:13px;margin-top:6px}
#prog{height:4px;background:var(--bd);border-radius:2px;margin-top:6px;overflow:hidden}#prog div{height:100%;width:0;background:var(--ac);transition:width .2s}
main{max-width:1200px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
main.list{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;gap:12px;text-decoration:none;color:inherit}
.card:hover{border-color:var(--ac)}
.av{width:56px;height:56px;border-radius:50%;flex:none;background:var(--bd);object-fit:cover;display:grid;place-items:center;font-weight:600;font-size:22px;color:var(--mut)}
.t{font-weight:600;line-height:1.25;word-break:break-word}.u{color:var(--ac);font-size:13px}
.s{color:var(--mut);font-size:12px;margin:2px 0 6px}.d{font-size:13px;color:#c3ccd5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
.err{color:#ff7b72}
#auth{max-width:420px;margin:30px auto;padding:20px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
#auth h2{margin:0 0 4px;font-size:18px}#auth p{color:var(--mut);font-size:13px;margin:0 0 14px}
#auth label{margin-bottom:10px}#auth input{width:100%}#auth button{width:100%;margin-top:4px}#auth a{color:var(--ac)}
#acc{color:var(--mut);font-size:13px;margin-left:auto;display:flex;gap:8px;align-items:center}#empty{max-width:1200px;margin:30px auto;color:var(--mut);text-align:center}
</style></head><body>
<header><div class="wrap">
<form id="f" class="row">
<label>Слово<input name="word" placeholder="channel" required></label>
<label>От<input name="start" type="number" value="1" min="0"></label>
<label>До<input name="max" type="number" value="900" min="1"></label>
<label>Найти штук<input name="limit" type="number" value="200" min="1"></label>
<label>Шаблон<select name="pattern"><option value="plain">word1, word2…</option><option value="underscore">word_1, word_2…</option><option value="both">оба</option></select></label>
<label>Тип<select name="channels_only"><option value="1">Только каналы</option><option value="0">Каналы и группы</option></select></label>
<label>Ссылки<select name="check_links"><option value="0">Не проверять</option><option value="1">Проверять инвайты</option></select></label>
<label>Постов загружать<input name="posts" type="number" value="10" min="0" max="50" title="Для поиска по постам и проверки ссылок. 0 = не загружать"></label>
<label>Пауза, с<input name="delay" type="number" value="1.2" step="0.1" min="0.3"></label>
<button id="go">Искать</button><button type="button" id="stop" class="stop" hidden>Стоп</button>
<button type="button" id="tog" class="sec">Фильтры ▾</button>
<span id="acc" hidden></span>
</form>
<div id="fl" class="fl" hidden>
 <div class="row">
  <label>Подписчиков от<input id="fmin" type="number" min="0" placeholder="0"></label>
  <label>до<input id="fmax" type="number" min="0" placeholder="∞"></label>
  <label>Текст<input id="fq" placeholder="поиск…"></label>
  <label>Где искать<select id="fin"><option value="all">Название, описание, посты</option><option value="meta">Название и описание</option><option value="posts">Только посты</option></select></label>
  <label>Создан от<input id="fd1" type="date"></label>
  <label>Создан до<input id="fd2" type="date"></label>
  <label>Ссылок всего ≥<input id="flinks" type="number" min="0" placeholder="0"></label>
  <label>Рабочих ссылок ≥<input id="falive" type="number" min="0" placeholder="0"></label>
  <label>Мёртвых ссылок ≥<input id="fdead" type="number" min="0" placeholder="0"></label>
  <label>Сортировка<select id="sort"><option value="order">По порядку поиска</option><option value="subs-desc">Подписчики ↓</option><option value="subs-asc">Подписчики ↑</option><option value="new">Создан: новые сверху</option><option value="old">Создан: старые сверху</option><option value="links">Ссылок всего ↓</option><option value="dead">Мёртвые ссылки ↓</option><option value="name">Название А–Я</option><option value="user">Username А–Я</option></select></label>
  <label>Вид<select id="view"><option value="grid">Сетка</option><option value="list">Список</option></select></label>
 </div>
 <div class="chips">
  <span class="chip" data-k="desc">С описанием</span>
  <span class="chip" data-k="ava">С аватаркой</span>
  <span class="chip" data-k="ver">Верифицированные</span>
  <span class="chip" data-k="ch">Только каналы</span>
  <span class="chip" data-k="gr">Только группы</span>
  <button type="button" id="reset" class="sec">Сбросить</button>
  <button type="button" id="csv" class="sec">⬇ CSV</button>
  <button type="button" id="clr" class="sec">🗑 Очистить список</button>
 </div>
</div>
<div id="bar"><span id="st">Введи слово и нажми «Искать»</span> · <b id="cnt"></b><div id="prog"><div></div></div></div>
</div></header>
<section id="auth" hidden></section>
<main id="grid"></main><div id="empty" hidden>Ничего не подходит под фильтры</div>
<script>
const $=s=>document.querySelector(s),grid=$('#grid');let es=null,total=1,all=[];const on=new Set();
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=id=>{const v=$(id).value;return v===''?null:+v};
function cardEl(c){const a=document.createElement('a');a.className='card';a.href=c.url;a.target='_blank';a.rel='noopener';
 const av=c.avatar?`<img class="av" src="${c.avatar}" loading="lazy">`:`<div class="av">${esc((c.title||'?')[0])}</div>`;
 const subs=c.subs!=null?c.subs.toLocaleString('ru')+' подп.':'';
 a.innerHTML=`${av}<div><div class="t">${esc(c.title)}${c.verified?' ✔':''}</div><div class="u">@${c.username}</div><div class="s">${c.type==='channel'?'Канал':'Группа'} · ${subs}${c.created?' · создан '+fmtDate(c):''}</div><div class="d">${esc(c.about)}</div>${postSnip(c)}${linkInfo(c)}</div>`;return a}
function postSnip(c){const q=$('#fq').value.trim().toLowerCase();if(!q||$('#fin').value==='meta')return'';const p=postHit(c,q);if(!p)return'';const i=p.toLowerCase().indexOf(q),s=Math.max(0,i-40);return `<div class="s">📝 …${esc(p.slice(s,i+q.length+80).replace(/\s+/g,' '))}…</div>`}
function fmtDate(c){return c.created?new Date(c.created).toLocaleDateString('ru'):''}
function linkInfo(c){const l=c.links;if(!l)return'';
 const ic={dead:'✖',alive:'✔',unknown:'?'};
 const tip=esc((l.items||l.dead_list.map(u=>({url:u,status:'dead'}))).map(i=>`${ic[i.status]} ${i.url}`+(i.title?` — ${i.title}`:'')+(i.members!=null?` (${i.members})`:'')+(i.reason?` — ${i.reason}`:'')).join('\n'));
 return `<div class="s" title="${tip}">🔗 ${l.total} ссылок · ${l.dead?`<span class="err">⚠ ${l.dead} мёртвых</span>`:'мёртвых нет'}${l.unknown?` · ❓ ${l.unknown} не проверено`:''}</div>`}
function postHit(c,q){return (c.posts||[]).find(p=>p.toLowerCase().includes(q))}
function matchQ(c,q){const w=$('#fin').value;
 const meta=((c.title||'')+' '+(c.about||'')+' '+c.username).toLowerCase().includes(q);
 if(w==='meta')return meta;if(w==='posts')return !!postHit(c,q);return meta||!!postHit(c,q)}
function visible(){const mn=num('#fmin'),mx=num('#fmax'),q=$('#fq').value.trim().toLowerCase();
 let r=all.filter(c=>{const s=c.subs??0;
  const L=c.links,tl=L?L.total:0,dl=L?L.dead:0,ln=num('#flinks'),an=num('#falive'),dn=num('#fdead');
  if(ln!=null&&tl<ln)return false;if(an!=null&&(tl-dl)<an)return false;if(dn!=null&&dl<dn)return false;
  if(mn!=null&&s<mn)return false;if(mx!=null&&s>mx)return false;
  const d1=$('#fd1').value,d2=$('#fd2').value;
  if(d1||d2){if(!c.created)return false;const d=c.created.slice(0,10);if(d1&&d<d1)return false;if(d2&&d>d2)return false}
  if(q&&!matchQ(c,q))return false;
  if(on.has('desc')&&!c.about)return false;if(on.has('ava')&&!c.avatar)return false;
  if(on.has('ver')&&!c.verified)return false;if(on.has('ch')&&c.type!=='channel')return false;
  if(on.has('gr')&&c.type!=='group')return false;return true});
 const so=$('#sort').value;
 if(so==='subs-desc')r.sort((a,b)=>(b.subs??-1)-(a.subs??-1));
 else if(so==='subs-asc')r.sort((a,b)=>(a.subs??1e12)-(b.subs??1e12));
 else if(so==='links')r.sort((a,b)=>((b.links?.total)??-1)-((a.links?.total)??-1));
 else if(so==='dead')r.sort((a,b)=>((b.links?.dead)??-1)-((a.links?.dead)??-1));
 else if(so==='new')r.sort((a,b)=>(b.created||'').localeCompare(a.created||''));
 else if(so==='old')r.sort((a,b)=>(a.created||'9').localeCompare(b.created||'9'));
 else if(so==='name')r.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ru'));
 else if(so==='user')r.sort((a,b)=>a.username.localeCompare(b.username));
 return r}
function render(){const r=visible();grid.className=$('#view').value==='list'?'list':'';
 grid.replaceChildren(...r.map(cardEl));$('#cnt').textContent=all.length?`показано ${r.length} из ${all.length}`:'';
 $('#empty').hidden=!(all.length&&!r.length)}
let t=null;const rs=()=>{clearTimeout(t);t=setTimeout(render,80)};
['#fmin','#fmax','#fq','#fdead','#flinks','#falive'].forEach(s=>$(s).oninput=rs);['#sort','#view','#fin','#fd1','#fd2'].forEach(s=>$(s).onchange=render);
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{const k=ch.dataset.k;
 if(k==='ch'&&!on.has('ch'))off('gr');if(k==='gr'&&!on.has('gr'))off('ch');
 on.has(k)?on.delete(k):on.add(k);ch.classList.toggle('on',on.has(k));render()});
function off(k){on.delete(k);document.querySelector(`.chip[data-k=${k}]`).classList.remove('on')}
$('#reset').onclick=()=>{on.clear();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
 ['#fmin','#fmax','#fq','#fdead','#flinks','#falive','#fd1','#fd2'].forEach(s=>$(s).value='');$('#fin').value='all';$('#sort').value='order';render()};
$('#tog').onclick=()=>{const h=$('#fl').hidden=!$('#fl').hidden;$('#tog').textContent=h?'Фильтры ▾':'Фильтры ▴'};
$('#csv').onclick=()=>{const r=visible();const q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\n/g,' ')+'"';
 const lines=[['username','title','type','subscribers','verified','url','invite_links','dead_links','created','about'].join(',')].concat(r.map(c=>[c.username,c.title,c.type,c.subs,c.verified,c.url,c.links?.total,c.links?.dead,c.created,c.about].map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download='channels.csv';a.click()};
function end(msg,err){$('#go').disabled=$('#acc').hidden;$('#stop').hidden=true;if(es){es.close();es=null}if(msg)$('#st').innerHTML=err?`<span class="err">${esc(msg)}</span>`:esc(msg)}
$('#f').onsubmit=e=>{e.preventDefault();if(es)return;$('#prog div').style.width='0';
 $('#go').disabled=true;$('#stop').hidden=false;$('#st').textContent='Подключаюсь…';
 es=new EventSource('/api/scan?'+new URLSearchParams(new FormData(e.target)));
 es.onmessage=m=>{const d=JSON.parse(m.data);
  if(d.event==='start')total=d.total;
  else if(d.event==='found'){const i=all.findIndex(x=>x.username===d.card.username);i>=0?all[i]=d.card:all.push(d.card);rs()}
  else if(d.event==='progress'){$('#st').textContent=`Проверено ${d.checked}/${total} · найдено ${d.found} · @${d.current}`;$('#prog div').style.width=(d.checked/total*100)+'%'}
  else if(d.event==='done')end(`Готово: проверено ${d.checked}, найдено ${d.found}`);
  else if(d.event==='error')end(d.msg,true)};
 es.onerror=()=>{if(es)end('Соединение закрыто (возможно, скан уже идёт в другой вкладке)',true)}};
$('#stop').onclick=()=>{fetch('/api/stop',{method:'POST'}).catch(()=>{});end('Остановлено')};

// ---------- вход в аккаунт ----------
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Ошибка '+r.status));return d});
function authUI(st){const box=$('#auth'),acc=$('#acc'),ok=st.authorized;
 $('#go').disabled=!ok||!!es;acc.hidden=!ok;box.hidden=ok;
 if(ok){acc.innerHTML=st.busy?'Аккаунт подключён':`👤 ${esc(st.name)}${st.username?' @'+esc(st.username):''} <button type="button" class="sec" id="lo">Выйти</button>`;
  const lo=$('#lo');if(lo)lo.onclick=async()=>{if(!confirm('Выйти из аккаунта?'))return;try{await post('/api/auth/logout');}catch(e){alert(e.message)}checkAuth()};return}
 const m=st.state;let h='';
 if(m==='phone')h=`<h2>Вход в Telegram</h2><p>Запросы будут идти от этого аккаунта. Лучше использовать отдельный, не основной.</p>
  ${st.has_creds?'':`<label>api_id<input id="aid" inputmode="numeric" autocomplete="off"></label><label>api_hash<input id="ah" autocomplete="off"></label><p>Получить на <a href="https://my.telegram.org" target="_blank" rel="noopener">my.telegram.org</a> → API development tools</p>`}
  <label>Номер телефона<input id="ph" placeholder="+380501234567" autocomplete="off"></label><button id="a1">Получить код</button>`;
 else if(m==='code')h=`<h2>Код из Telegram</h2><p>Код пришёл в приложение Telegram (или по SMS).</p><label>Код<input id="cd" inputmode="numeric" autocomplete="off"></label><button id="a2">Войти</button><button class="sec" id="back" type="button">Другой номер</button>`;
 else h=`<h2>Пароль 2FA</h2><p>На аккаунте включена двухэтапная проверка.</p><label>Пароль<input id="pw" type="password" autocomplete="off"></label><button id="a3">Войти</button>`;
 box.innerHTML=h+'<div id="aerr" class="err" style="margin-top:10px"></div>';
 const run=(id,fn)=>{const b=$(id);if(!b)return;b.onclick=async()=>{b.disabled=true;$('#aerr').textContent='';try{await fn();await checkAuth()}catch(e){$('#aerr').textContent=e.message;b.disabled=false}}};
 run('#a1',()=>post('/api/auth/send',{phone:$('#ph').value,api_id:$('#aid')?.value,api_hash:$('#ah')?.value}));
 run('#a2',()=>post('/api/auth/code',{code:$('#cd').value}));
 run('#a3',()=>post('/api/auth/password',{password:$('#pw').value}));
 const bk=$('#back');if(bk)bk.onclick=async()=>{await post('/api/auth/logout').catch(()=>{});checkAuth()};
 const inp=box.querySelector('input:not([id=aid]):not([id=ah])')||box.querySelector('input');if(inp)inp.focus();
 box.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){const b=box.querySelector('button:not(.sec)');if(b)b.click()}})}
async function checkAuth(){try{authUI(await fetch('/api/auth/status').then(r=>r.json()))}catch(e){$('#st').textContent='Нет связи с сервером'}}
checkAuth();
$('#clr').onclick=async()=>{if(!all.length||!confirm(`Удалить все сохранённые каналы (${all.length})?`))return;
 try{await post('/api/results/clear');all=[];render();$('#st').textContent='Список очищен'}catch(e){alert(e.message)}};
fetch('/api/results').then(r=>r.json()).then(r=>{all=r;render();if(r.length)$('#st').textContent=`Загружено сохранённых каналов: ${r.length}`}).catch(()=>{});
</script></body></html>
